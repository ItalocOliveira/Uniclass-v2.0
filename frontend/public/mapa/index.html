<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa do Campus - Navegação</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/style-map.css">

  <script src="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.js"></script>
  <link href="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
</head>

<body id="mapContainer">

  <div id="painel-distancia">
    Restam: <span id="distancia-texto"></span>
  </div>

  <div id="painel-chegada" style="display: none;">
    <div>
      <span style="font-size: 24px;"></span><br>
      <strong>Você chegou!</strong>
    </div>
    <button id="painel-chegada-button" onclick="encerrarNavegacao()"
      style="margin-top:10px; padding:5px 10px; cursor:pointer;">
      Encerrar navegação
    </button>
  </div>

  <button id="openNavBtn" onclick="toggleNavPanel()" onmouseover="this.style.transform='scale(1.08)'"
    onmouseout="this.style.transform='scale(1)'" style="
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 3000;
    background: #2563eb;
    color: white;
    border: none;
    width: 56px;
    height: 56px;
    border-radius: 999px;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    transition: .15s ease;
  ">
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" stroke="white" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M12 2L19 21L12 17L5 21Z"></path>
    </svg>
  </button>

  <div id="navPanel" style="
    position: fixed; 
    top: 12px; 
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000; 
    background: white; 
    padding: 16px; 
    border-radius: 16px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    width: 280px;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: none;
  ">

    <h4 style="
        margin: 0 0 12px 0; 
        font-size: 17px; 
        font-weight: 700; 
        display: flex; 
        justify-content: space-between;
        align-items: center; 
        gap: 6px;
    ">
      Navegação

      <button onclick="toggleNavPanel()" style="
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
      ">✕</button>
    </h4>

    <label style="font-size: 13px; color: #555; display:block; margin-bottom: 6px;">
      Destino
    </label>

    <div style="display: flex; gap: 8px;">
      <select id="seletorLocais" style="
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
        ">
        <option value="">Selecione um destino</option>
      </select>

      <button onclick="irParaSelecionado()" style="
            padding: 10px 14px; 
            background: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s ease;
        " onmouseover="this.style.background='#1e4ed8'" onmouseout="this.style.background='#2563eb'">
        IR
      </button>
    </div>

    <hr style="margin: 14px 0; border: none; border-top: 1px solid #eee;">

    <small style="font-size: 13px; color: #666;">Andar</small>

    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button onclick="mudarAndar(0)" style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #2563eb;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        ">Térreo</button>

      <button onclick="mudarAndar(1)" style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #f7f7f7;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        ">1º Andar</button>

      <button onclick="mudarAndar(2)" style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #f7f7f7;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        ">2º Andar</button>
    </div>

  </div>

  <div id="map"></div>

  <script>
    setTimeout(() => {
      const select = document.getElementById('seletorLocais');

      if (typeof locais !== 'undefined' && locais.length > 0) {
        locais.forEach(local => {
          const option = document.createElement('option');
          option.value = local.properties.nome;
          option.text = `${local.properties.nome} (Lvl ${local.properties.level})`;
          select.appendChild(option);
        });
      } else {
        console.warn("Ainda não carregou os locais ou variável 'locais' não existe.");
      }
    }, 1000);

    function irParaSelecionado() {
      const nomeSala = document.getElementById('seletorLocais').value;
      if (nomeSala) {
        selecionarLocal(nomeSala);
      } else {
        alert("Selecione alguma sala na lista!");
      }
    }

    function controlarPainel() {
      const panel = document.getElementById("navPanel");
      const btn = document.getElementById("openNavBtn");

      const largura = document.documentElement.clientWidth;

      if (largura < 768) {
        btn.style.display = "flex";
        panel.style.display = "none";
      } else {
        btn.style.display = "none";
        panel.style.display = "block";
      }
    }

    function toggleNavPanel() {
      const panel = document.getElementById("navPanel");

      panel.style.display = (panel.style.display === "block") ? "none" : "block";
    }

    window.addEventListener("resize", controlarPainel);
    window.addEventListener("load", controlarPainel);
  </script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./scripts/inicializacao.js"></script>
  <script src="./scripts/navegacao.js"></script>

</body>

</html>
