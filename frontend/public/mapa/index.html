<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa do Campus - Navegação</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./css/style-map.css">

  <script src="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.js"></script>
  <link href="https://unpkg.com/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
</head>

<body id="mapContainer">

  <div id="painel-distancia">
    Restam: <span id="distancia-texto"></span>
  </div>

  <div id="painel-chegada" style="display: none;">
    <div>
      <span style="font-size: 24px;"></span><br>
      <strong>Você chegou!</strong>
    </div>
    <button id="painel-chegada-button" onclick="encerrarNavegacao()"
      style="margin-top:10px; padding:5px 10px; cursor:pointer;">
      Encerrar navegação
    </button>
  </div>

  <button id="openNavBtn" onclick="toggleNavPanel()" onmouseover="this.style.transform='scale(1.08)'"
    onmouseout="this.style.transform='scale(1)'" style="
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 3000;
    background: #2563eb;
    color: white;
    border: none;
    width: 56px;
    height: 56px;
    border-radius: 999px;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    transition: .15s ease;
  ">
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" stroke="white" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M12 2L19 21L12 17L5 21Z"></path>
    </svg>
  </button>

  <div id="navPanel" style="
    position: fixed; 
    top: 12px; 
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000; 
    background: white; 
    padding: 16px; 
    border-radius: 16px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    width: 280px;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: none;
  ">

    <h4 style="
        margin: 0 0 12px 0; 
        font-size: 17px; 
        font-weight: 700; 
        display: flex; 
        justify-content: space-between;
        align-items: center; 
        gap: 6px;
    ">
      Navegação

      <button onclick="toggleNavPanel()" style="
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
      ">✕</button>
    </h4>

    <label style="font-size: 13px; color: #555; display:block; margin-bottom: 6px;">
      Destino
    </label>

    <div style="display: flex; gap: 24px;">
      <div style="position: relative; flex: 1;">
        <input type="text" id="buscaLocal" placeholder="Pesquisar destino..." style="
      width: 100%;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 12px;
      outline: none;
    " oninput="filtrarLocais()">

        <div id="listaResultados" style="
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      max-height: 220px;
      overflow-y: auto;
      display: none;
      z-index: 9999;
    "></div>
      </div>

      <button onclick="irParaSelecionado()" style="
  padding: 10px 14px; 
  background: #2563eb; 
  color: white; 
  border: none; 
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
">
        IR
      </button>
    </div>

    <hr style="margin: 14px 0; border: none; border-top: 1px solid #eee;">

    <small style="font-size: 13px; color: #666;">Andar</small>

    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button onclick="mudarAndar(0)" style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #2563eb;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        ">Térreo</button>

      <button onclick="mudarAndar(1)" style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #f7f7f7;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        ">1º Andar</button>

      <button onclick="mudarAndar(2)" style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #f7f7f7;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        ">2º Andar</button>
    </div>

  </div>

  <div id="map"></div>

  <script>
    function irParaSelecionado() {
      if (localSelecionado) {
        selecionarLocal(localSelecionado);
      } else {
        alert("Pesquise e selecione um destino!");
      }
    }

    function controlarPainel() {
      const panel = document.getElementById("navPanel");
      const btn = document.getElementById("openNavBtn");

      const largura = document.documentElement.clientWidth;

      if (largura < 768) {
        btn.style.display = "flex";
        panel.style.display = "none";
      } else {
        btn.style.display = "none";
        panel.style.display = "block";
      }
    }

    function toggleNavPanel() {
      const panel = document.getElementById("navPanel");
      panel.style.display = (panel.style.display === "block") ? "none" : "block";
    }

    window.addEventListener("resize", controlarPainel);
    window.addEventListener("load", controlarPainel);
  </script>

  <script>
    let localSelecionado = null;

    function filtrarLocais() {
      const input = document.getElementById("buscaLocal");
      const lista = document.getElementById("listaResultados");
      const termo = input.value.toLowerCase();

      lista.innerHTML = "";
      localSelecionado = null;

      if (!termo || !window.locais || locais.length === 0) {
        lista.style.display = "none";
        return;
      }

      const resultados = locais.filter(local =>
        local.properties.nome.toLowerCase().includes(termo)
      );

      if (resultados.length === 0) {
        lista.style.display = "none";
        return;
      }

      resultados.forEach(local => {
        const item = document.createElement("div");

        item.innerHTML = `
        <strong>${local.properties.nome}</strong>
        <small style="color:#666;"> — Lvl ${local.properties.level}</small>
      `;

        item.style.cssText = `
        padding: 10px;
        cursor: pointer;
        font-size: 14px;
        border-bottom: 1px solid #eee;
        transition: background 0.15s ease;
      `;

        item.onmouseenter = () => item.style.background = "#f3f6ff";
        item.onmouseleave = () => item.style.background = "#fff";

        item.onclick = () => {
          input.value = local.properties.nome;
          localSelecionado = local.properties.nome;
          lista.style.display = "none";
          selecionarLocal(local.properties.nome);
        };

        lista.appendChild(item);
      });

      lista.style.display = "block";
    }

    document.addEventListener("click", (e) => {
      const input = document.getElementById("buscaLocal");
      const lista = document.getElementById("listaResultados");

      if (!input.contains(e.target) && !lista.contains(e.target)) {
        lista.style.display = "none";
      }
    });
  </script>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./scripts/inicializacao-mapa.js"></script>
  <script src="./scripts/navegacao.js"></script>

</body>

</html>
