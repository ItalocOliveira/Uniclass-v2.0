<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa do Campus - Navegação</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="./css/style-map.css">
</head>

<body>

  <div id="painel-distancia">
    Restam: <span id="distancia-texto"></span>
  </div>
  <div id="painel-chegada" style="display: none;">
    <div>
      <span style="font-size: 24px;"></span><br>
      <strong>Você chegou!</strong>
    </div>
    <button id="painel-chegada-button" onclick="finishNavigation()"
      style="margin-top:10px; padding:5px 10px; cursor:pointer;">
      Encerrar navegação
    </button>

  </div>

  <button id="openNavBtn" onclick="toggleNavPanel()" onmouseover="this.style.transform='scale(1.08)'"
    onmouseout="this.style.transform='scale(1)'" style="
    position: fixed;
    bottom: 40px;
    left: 16px;
    z-index: 3000;
    background: #2563eb;
    color: white;
    border: none;
    width: 56px;
    height: 56px;
    border-radius: 999px;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    transition: .15s ease;
  ">
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="none" stroke="white" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M12 2L19 21L12 17L5 21Z"></path>
    </svg>
  </button>

  <div id="navPanel" style="
    position: fixed; 
    top: 10px; 
    left: 60%;
    transform: translateX(-50%);
    z-index: 2000; 
    background: white; 
    padding: 16px; 
    border-radius: 16px; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    width: 280px;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: none;
  ">

    <h4 style="
        margin: 0 0 12px 0; 
        font-size: 17px; 
        font-weight: 700; 
        display: flex; 
        justify-content: space-between;
        align-items: center; 
        gap: 6px;
    ">
      Navegação

      <button onclick="toggleNavPanel()" style="
        background: transparent;
        border: none;
        font-size: 18px;
        cursor: pointer;
      ">✕</button>
    </h4>

    <div style="display: flex; gap: 24px;">
      <div style="position: relative; flex: 1;">
        <input type="text" id="buscaLocal" placeholder="Pesquisar destino..." style="
      width: 100%;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 12px;
      outline: none;
    " oninput="filtrarLocais()">

        <div id="listaResultados" style="
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      max-height: 220px;
      overflow-y: auto;
      display: none;
      z-index: 9999;
    "></div>
      </div>

      <button onclick="irParaSelecionado()" style="
  padding: 10px 14px; 
  background: #2563eb; 
  color: white; 
  border: none; 
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
">
        IR
      </button>
    </div>

    <div style="
    display: flex; 
    flex-direction: row; 
    justify-content: space-around; 
    align-items: center; 
    background-color: #f7f7f7; 
    border: 1px solid #ddd; 
    border-radius: 8px;
    " id="transportModes">
      <section onclick="selectMode(this)"
        style="padding:8px; border-radius:8px; cursor:pointer; transition:all .2s ease;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M12 4a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
          <path d="M7 21l3 -4" />
          <path d="M16 21l-2 -4l-3 -3l1 -6" />
          <path d="M6 12l2 -3l4 -1l3 3l3 1" />
        </svg>
      </section>

      <section onclick="selectMode(this)"
        style="padding:8px; border-radius:8px; cursor:pointer; transition:all .2s ease;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M5 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
          <path d="M15 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
          <path d="M5 17h-2v-6l2 -5h9l4 5h1a2 2 0 0 1 2 2v4h-2m-4 0h-6m-6 -6h15m-6 0v-5" />
        </svg>
      </section>

      <section onclick="selectMode(this)"
        style="padding:8px; border-radius:8px; cursor:pointer; transition:all .2s ease;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M2 16a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
          <path d="M16 16a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
          <path d="M7.5 14h5l4 -4h-10.5m1.5 4l4 -4" />
          <path d="M13 6h2l1.5 3l2 4" />
        </svg>
      </section>
    </div>

    <div style="
  margin-top: 14px;
  display: flex;
  gap: 10px;
">

      <button onclick="findNearestPoint('banheiro')" style="
    flex: 1;
    padding: 6px;
    border-radius: 12px;
    border: none;
    background: #f3f4f6;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  ">
        🚻
      </button>

      <button onclick="findNearestPoint('bebedouro')" style="
    flex: 1;
    padding: 6px;
    border-radius: 12px;
    border: none;
    background: #f3f4f6;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  ">
        🚰
      </button>

    </div>

    <script>
      function selectMode(el) {
        document.querySelectorAll("#transportModes section").forEach(s => {
          s.style.backgroundColor = "";
          s.style.color = "";
        });
        el.style.backgroundColor = "#2563eb";
        el.style.color = "white";
      }
    </script>

    <small style="font-size: 13px; color: #666;">Andar</small>

    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button onclick="changeFloor(0)" style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #2563eb;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        ">Térreo</button>

      <button onclick="changeFloor(1)" style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #f7f7f7;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        ">1º Andar</button>

      <button onclick="changeFloor(2)" style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #f7f7f7;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        ">2º Andar</button>
    </div>

    <div style="
    display: flex;
    align-items: center;
    justify-content: space-between;">

      <button style="
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #7e1515;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        " onclick="finishNavigation()">

        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="icon icon-tabler icons-tabler-outline icon-tabler-map-pin-off">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M9.442 9.432a3 3 0 0 0 4.113 4.134m1.445 -2.566a3 3 0 0 0 -3 -3" />
          <path
            d="M17.152 17.162l-3.738 3.738a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 0 1 -.476 -10.794m2.18 -1.82a8.003 8.003 0 0 1 10.91 10.912" />
          <path d="M3 3l18 18" />
        </svg>
      </button>
    </div>

  </div>

  <div id="map"></div>

  <!-- Listagem de locais para o menu  -->
  <script>
    function irParaSelecionado() {
      if (localSelecionado) {
        selectLocation(localSelecionado);
      } else {
        alert("Pesquise e selecione um destino!");
      }
    }

    function controlarPainel() {
      const panel = document.getElementById("navPanel");
      const btn = document.getElementById("openNavBtn");

      const largura = document.documentElement.clientWidth;

      if (largura < 768) {
        btn.style.display = "flex";
        panel.style.display = "none";
      } else {
        btn.style.display = "none";
        panel.style.display = "block";
      }
    }

    function toggleNavPanel() {
      const panel = document.getElementById("navPanel");
      panel.style.display = (panel.style.display === "block") ? "none" : "block";
    }

    window.addEventListener("resize", controlarPainel);
    window.addEventListener("load", controlarPainel);
  </script>

  <script>
    let localSelecionado = null;

    function filtrarLocais() {
      const input = document.getElementById("buscaLocal");
      const lista = document.getElementById("listaResultados");
      const termo = input.value.toLowerCase();

      lista.innerHTML = "";
      localSelecionado = null;

      if (!termo || !window.locais || locais.length === 0) {
        lista.style.display = "none";
        return;
      }

      const resultados = locais.filter(local =>
        local.properties.nome.toLowerCase().includes(termo)
      );

      if (resultados.length === 0) {
        lista.style.display = "none";
        return;
      }

      resultados.forEach(local => {
        const item = document.createElement("div");

        item.innerHTML = `
              <strong>${local.properties.nome}</strong>
              <small style="color:#666;"> — Lvl ${local.properties.level}</small>
            `;

        item.style.cssText = `
              padding: 10px;
              cursor: pointer;
              font-size: 14px;
              border-bottom: 1px solid #eee;
              transition: background 0.15s ease;
            `;

        item.onmouseenter = () => item.style.background = "#f3f6ff";
        item.onmouseleave = () => item.style.background = "#fff";

        item.onclick = () => {
          input.value = local.properties.nome;
          localSelecionado = local.properties.nome;
          lista.style.display = "none";
          selectLocation(local.properties.nome);
        };

        lista.appendChild(item);
      });

      lista.style.display = "block";
    }

    document.addEventListener("click", (e) => {
      const input = document.getElementById("buscaLocal");
      const lista = document.getElementById("listaResultados");

      if (!input.contains(e.target) && !lista.contains(e.target)) {
        lista.style.display = "none";
      }
    });
  </script>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@mapbox/leaflet-pip@latest/leaflet-pip.min.js"></script>

  <script src="./scripts/utils.js"></script>
  <script src="./scripts/map-setup.js"></script>
  <script src="./scripts/data.js"></script>
  <script src="./scripts/indoor-engine.js"></script>
  <script src="./scripts/navigation.js"></script>
  <script src="./scripts/dev-functions.js"></script>
  <script src="./scripts/main.js"></script>
</body>

</html>
